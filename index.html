<div class="m3u-container">
    <!-- 좌측 사이드 패널 -->
    <aside id="m3u-sidebar" class="m3u-sidebar">
        <!-- 상단 헤더: 액션 버튼 툴바 -->
        <div class="m3u-sidebar-header">
            <div class="m3u-action-toolbar">
                <button id="btn-open-sources" class="m3u-btn m3u-btn-primary" title="M3U 및 EPG 주소 관리">
                    <i class="fa-solid fa-layer-group fas fa-layer-group"></i> ⚙️ 소스 관리
                </button>
                <button id="btn-check-health" class="m3u-btn m3u-btn-cyan" title="방송 스트림 가용성 점검">
                    <i class="fa-solid fa-stethoscope fas fa-stethoscope"></i> 점검
                </button>
                <button id="btn-refresh-all" class="m3u-btn m3u-btn-secondary m3u-btn-icon" title="채널 및 EPG 새로고침">
                    <i class="fa-solid fa-rotate-right fas fa-redo"></i>
                </button>
                <button id="btn-toggle-sidebar" class="m3u-btn m3u-btn-secondary m3u-btn-icon" title="사이드 패널 숨기기">
                    <i class="fa-solid fa-angles-left fas fa-angle-double-left"></i>
                </button>
            </div>

            <!-- 채널 필터 및 검색창 -->
            <div class="m3u-filter-group">
                <select id="m3u-source-select" class="m3u-select">
                    <option value="ALL">전체 소스</option>
                </select>
                <select id="m3u-group-select" class="m3u-select">
                    <option value="ALL">전체 그룹</option>
                    <option value="FAVORITES">⭐ 즐겨찾기</option>
                </select>
                <input type="text" id="m3u-search-input" class="m3u-input" placeholder="채널 검색..." autocomplete="off">
            </div>
        </div>

        <!-- 상태 정보 표시 바 -->
        <div class="m3u-channel-info-bar">
            <span id="channel-count-badge">채널 0개</span>
            <span id="health-status-badge" class="m3u-badge" style="display: none;">점검 중...</span>
            <span id="loading-spinner" class="m3u-spinner" style="display: none;">
                <i class="fa-solid fa-circle-notch fas fa-spinner fa-spin"></i>
            </span>
        </div>

        <!-- 채널 리스트 뷰포트 -->
        <ul id="m3u-channel-list" class="m3u-channel-list">
            <!-- 채널 목록 동적 생성 -->
        </ul>
    </aside>

    <!-- 사이드바 접힘 시 좌측 가장자리 핫스팟 감지 영역 -->
    <div id="m3u-sidebar-hotspot" class="m3u-sidebar-hotspot" title="마우스를 올리면 목록 버튼이 나타납니다"></div>

    <!-- 채널 패널 경계선 중앙 접기/펼치기 토글 핸들 -->
    <button id="btn-sidebar-toggle" class="m3u-sidebar-toggle-handle" type="button" aria-label="채널 목록 토글" title="채널 목록 접기/펼치기">
        <i class="fa-solid fa-chevron-left fas fa-chevron-left"></i>
    </button>

    <!-- 우측 비디오 메인 플레이어 -->
    <main class="m3u-main-player">
        <div class="m3u-player-wrapper">
            <video id="video-element" class="m3u-video" controls playsinline></video>
            <div id="video-overlay-msg" class="m3u-overlay-msg">재생할 채널을 선택해 주세요.</div>
        </div>

        <!-- 하단 채널 메타데이터 & EPG 방영 정보 바 -->
        <div class="m3u-current-channel-bar">
            <div class="current-channel-meta">
                <div class="current-channel-top">
                    <button id="btn-fav-current" class="m3u-btn-fav" title="현재 채널 즐겨찾기">
                        <i class="fa-regular fa-star far fa-star"></i>
                    </button>
                    <h3 id="current-channel-name" class="current-title">선택된 채널 없음</h3>
                    <span id="current-channel-group" class="current-group">그룹: -</span>
                </div>
                <div id="current-epg-info" class="current-epg-info">
                    <span class="epg-title">편성 정보 없음</span>
                </div>
            </div>
            <div class="current-channel-actions">
                <button id="btn-reload-stream" class="m3u-btn m3u-btn-secondary" title="스트림 재연결">
                    <i class="fa-solid fa-arrows-rotate fas fa-sync-alt"></i> 재연결
                </button>
            </div>
        </div>
    </main>

    <!-- 소스 관리 설정 모달 수정 -->
    <div id="m3u-modal-overlay" class="m3u-modal-overlay" style="display: none;">
        <div class="m3u-modal-content">
            <div class="m3u-modal-header">
                <h3><i class="fa-solid fa-sliders fas fa-sliders-h"></i> ALIVE 플레이어 설정</h3>
                <button id="btn-close-modal" class="m3u-modal-close">&times;</button>
            </div>
            
            <div class="m3u-modal-body">
                <!-- 1. 플레이리스트 관리 -->
                <div class="m3u-modal-section">
                    <h4 class="m3u-modal-section-title"><i class="fa-solid fa-list-ul fas fa-list-ul"></i> 플레이리스트 관리 (M3U)</h4>
                    <div id="m3u-source-list" class="m3u-source-list">
                        <!-- 소스 행 동적 생성 -->
                    </div>
                    <button id="btn-add-source" type="button" class="m3u-btn m3u-btn-secondary m3u-btn-add-source">
                        <i class="fa-solid fa-plus fas fa-plus"></i> 소스 추가
                    </button>
                </div>

                <!-- 2. EPG 설정 -->
                <div class="m3u-modal-section">
                    <h4 class="m3u-modal-section-title"><i class="fa-solid fa-calendar-days fas fa-calendar-alt"></i> EPG 설정 (우선순위 순)</h4>
                    <div class="m3u-form-group">
                        <label>EPG 주소 1 (최우선)</label>
                        <input type="text" id="cfg-epg-url1" class="m3u-input" placeholder="http://.../epg_primary.xml">
                    </div>
                    <div class="m3u-form-group">
                        <label>EPG 주소 2 (차순위/백업)</label>
                        <input type="text" id="cfg-epg-url2" class="m3u-input" placeholder="http://.../epg_secondary.xml">
                    </div>
                </div>

                <!-- 3. EPG 자동 갱신 주기 -->
                <div class="m3u-modal-section">
                    <h4 class="m3u-modal-section-title"><i class="fa-solid fa-clock-rotate-left fas fa-history"></i> EPG 주소 갱신</h4>
                    <div class="m3u-form-group">
                        <label>자동 갱신 주기</label>
                        <select id="cfg-epg-interval" class="m3u-select">
                            <option value="30">30분마다 자동 갱신</option>
                            <option value="60" selected>1시간마다 자동 갱신</option>
                            <option value="720">12시간마다 자동 갱신</option>
                            <option value="1440">24시간마다 자동 갱신</option>
                            <option value="0">자동 갱신 안 함 (수동)</option>
                        </select>
                    </div>
                </div>

                <!-- 4. 재생 동작 및 버퍼/싱크 설정 -->
                <div class="m3u-modal-section">
                    <h4 class="m3u-modal-section-title"><i class="fa-solid fa-play fas fa-play"></i> 재생 동작 및 버퍼/싱크 모드</h4>
                    <div class="m3u-form-group">
                        <label>스트림 버퍼 및 싱크 모드</label>
                        <select id="cfg-playback-mode" class="m3u-select">
                            <option value="smooth" selected>안정적인 버퍼 모드 (끊김 방지 권장)</option>
                            <option value="standard">표준 균형 모드</option>
                            <option value="low_latency">초저지연 모드 (딜레이 최소화)</option>
                        </select>
                    </div>
                    <div class="m3u-checkbox-wrapper" style="margin-top: 6px;">
                        <label class="m3u-checkbox-label">
                            <input type="checkbox" id="cfg-auto-resume" class="m3u-checkbox">
                            <span class="m3u-checkbox-text">메뉴 재진입 시 마지막 시청 채널 자동 재생</span>
                        </label>
                        <span class="m3u-checkbox-desc">체크를 해제하면 다른 메뉴에서 돌아왔을 때 대기 상태의 초기 화면으로 시작합니다.</span>
                    </div>
                </div>
            </div>

            <div class="m3u-modal-footer">
                <span class="m3u-modal-tip">※ 외부 도메인은 BookOasis [설정 ⚙️ > 외부 도메인]에 사전 등록되어야 합니다.</span>
                <div class="m3u-modal-btns">
                    <button id="btn-modal-cancel" class="m3u-btn m3u-btn-secondary">취소</button>
                    <button id="btn-modal-save" class="m3u-btn m3u-btn-accent">저장 및 적용</button>
                </div>
            </div>
        </div>
    </div>
</div>
